name: Collect trends

# Runs on a schedule and can be triggered by hand.
# Public repositories get unlimited free GitHub-hosted runner minutes, which
# is what makes this whole pipeline free to operate.
on:
  schedule:
    # Off the top of the hour on purpose: GitHub's scheduler congests on the
    # hour and can drop queued jobs. "23" avoids that window.
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      quick:
        description: "Reduced collection budget (test run)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TREND_DB: data/observations.sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yt-dlp

      - name: Cache observation store
        uses: actions/cache/restore@v4
        with:
          path: data/observations.sqlite
          key: obs-${{ github.run_number }}
          restore-keys: obs-

      - name: Cache observation store (save)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/observations.sqlite
          key: obs-${{ github.run_number }}

      - name: Collect
        run: |
          python -m collector.run --no-llm ${{ inputs.quick && '--quick' || '' }}

      - name: Validate signals
        run: python -m tools.validate

      - name: Publish data branch
        run: |
          # The dashboard reads live data from the raw file host on this
          # branch, so the site updates without a Netlify rebuild.
          git config user.name  "trend-intel-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan data
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf .github collector tools web .gitignore requirements.txt netlify.toml FEASIBILITY-REPORT.md README.md
          mkdir -p data/snapshots
          cp -f data/latest.json data/series.json data/validation.json data/ 2>/dev/null || true
          cp -f data/snapshots/*.json data/snapshots/ 2>/dev/null || true
          git add -A data
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git push --force origin data

      - name: Commit artefacts to main
        run: |
          git checkout main
          git config user.name  "trend-intel-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p data/snapshots
          cp -f data/latest.json data/series.json data/validation.json data/ 2>/dev/null || true
          cp -f data/snapshots/*.json data/snapshots/ 2>/dev/null || true
          git add -f data/latest.json data/series.json data/validation.json data/snapshots 2>/dev/null || true
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git push origin main
