name: Collect trends

# Runs on a schedule and can be triggered by hand.
# Public repositories get unlimited free GitHub-hosted runner minutes, which
# is what makes this whole pipeline free to operate.
on:
  schedule:
    # Off the top of the hour on purpose: GitHub's scheduler congests on the
    # hour and can drop queued jobs. "23" avoids that window.
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      quick:
        description: "Reduced collection budget (test run)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TREND_DB: data/observations.sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yt-dlp

      - name: Cache observation store
        uses: actions/cache/restore@v4
        with:
          path: data/observations.sqlite
          key: obs-${{ github.run_number }}
          restore-keys: obs-

      - name: Collect
        run: python -m collector.run --no-llm ${{ inputs.quick && '--quick' || '' }}

      - name: Validate signals
        run: python -m tools.validate

      - name: Cache observation store (save)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/observations.sqlite
          key: obs-${{ github.run_number }}

      # The observation store is also committed to the repository once a week.
      # The Actions cache is a fast restore, but caches are evicted after 7
      # days of inactivity and are not a durable backup; a weekly commit
      # makes the history survive a cache wipe and keeps the store owned by
      # the project rather than by a CI provider.
      - name: Weekly history checkpoint
        run: |
          set -euo pipefail
          today="data/.checkpoint-$(date -u +%Y-W%V)"
          if [ -f "$today" ]; then
            echo "checkpoint already taken this week"
            exit 0
          fi
          sqlite3 data/observations.sqlite "PRAGMA wal_checkpoint(TRUNCATE);" || true
          sqlite3 data/observations.sqlite "VACUUM;" || true
          git config user.name  "trend-intel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/observations.sqlite "$today"
          git commit -q -m "history: weekly observation checkpoint $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push origin HEAD:main

      # The dashboard reads live data from the raw file host on the `data`
      # branch, so the site updates every cycle without a Netlify rebuild.
      # The branch is force-pushed from a clean temp repository: no branch
      # surgery in the working tree, and no unbounded history on `main`.
      - name: Publish data branch
        run: |
          set -euo pipefail
          rm -rf /tmp/databranch
          mkdir -p /tmp/databranch/data/snapshots
          cp -f data/latest.json data/series.json /tmp/databranch/data/ 2>/dev/null || true
          cp -f data/validation.json /tmp/databranch/data/ 2>/dev/null || true
          cp -f data/snapshots/*.json /tmp/databranch/data/snapshots/ 2>/dev/null || true
          cd /tmp/databranch
          git init -q -b data
          git config user.name  "trend-intel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data: snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
